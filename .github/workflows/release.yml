name: Release (draft)

# Pushing a tag like v1.0.0 builds installers for every platform and uploads
# them, with the latest*.yml update metadata, to a DRAFT GitHub release.
# A person reviews and publishes the draft by hand. Nothing here publishes.
# See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Create the draft if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
            if [ "$draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to touch it." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Bugglebrook $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  build:
    name: Build and upload (${{ matrix.os }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No tests here: tag a commit that CI already passed on main (RELEASING.md).
      # The unit suite's timing and soak tests are tuned for CI's Ubuntu runner.
      - run: pnpm build
      # releaseType: draft in electron-builder.yml keeps this a draft.
      - run: pnpm exec electron-builder ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report installer sizes
        shell: bash
        run: |
          {
            echo "### Installers (${{ runner.os }})"
            echo
            echo '| File | Size |'
            echo '|---|---|'
            for f in dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb; do
              if [ -f "$f" ]; then echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  verify:
    name: Check the draft
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check the draft holds every installer and the update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)
          if [ "$(echo "$json" | jq -r .isDraft)" != "true" ]; then
            echo "Release $GITHUB_REF_NAME is not a draft." >&2
            exit 1
          fi
          names=$(echo "$json" | jq -r '.assets[].name')
          echo "$json" | jq -r '.assets[] | "| \(.name) | \(.size / 1048576 | floor) MB |"' |
            { echo "### Draft $GITHUB_REF_NAME"; echo; echo '| File | Size |'; echo '|---|---|'; cat; } |
            tee -a "$GITHUB_STEP_SUMMARY"
          missing=0
          for pattern in '^latest\.yml$' '^latest-mac\.yml$' '^latest-linux\.yml$' \
            'Setup-.*\.exe$' 'Setup-.*\.exe\.blockmap$' \
            'mac-x64\.dmg$' 'mac-arm64\.dmg$' 'mac-x64\.zip$' 'mac-arm64\.zip$' \
            '\.AppImage$' '_amd64\.deb$'; do
            if ! echo "$names" | grep -Eq "$pattern"; then
              echo "Missing from the draft: $pattern" >&2
              missing=1
            fi
          done
          exit $missing
